<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="images/logo001.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script>document.documentElement.dataset.theme=localStorage.tharu_theme||"light"</script><title>Cart | THARU Juice Bar</title></head>
<body><div id="hdr"></div>
<main class="wrap"><section><h2 data-i18n="cartT"></h2><div class="cartgrid"><div id="lines" class="clay"></div>
<form id="f" class="clay"><label><span data-i18n="name"></span><input id="n" required autocomplete="name"></label><label><span data-i18n="phone"></span><input id="p" type="tel" required autocomplete="tel"></label>
<label><span data-i18n="type"></span><select id="ty"><option value="pickup"></option><option value="delivery"></option></select></label>
<label><span data-i18n="addr"></span><textarea id="ad" rows="3"></textarea></label>
<p id="cl" class="mut" style="margin-bottom:12px" hidden></p>
<button class="btn l" style="width:100%" id="go"><span data-ico="wa"></span><span data-i18n="send"></span></button></form></div></section></main><div id="ftr"></div>
<script type="module">
import {WA,shop,mountHeader,t,nm,money,lang,getCart,setCart,toast} from './js/app.js';
mountHeader('cart.html');
const $=id=>document.getElementById(id);
function draw(){
  const c=getCart(),tot=c.reduce((a,i)=>a+i.p*i.q,0);
  $('lines').innerHTML=c.length?c.map((i,k)=>`<div class="line"><div><b>${nm(i).replace(/</g,'&lt;')}</b><br><span class="mut">${money(i.p)}</span></div><div class="qty"><button class="btn s g" data-k="${k}" data-d="-1" aria-label="-">-</button>${i.q}<button class="btn s g" data-k="${k}" data-d="1" aria-label="+">+</button></div><button class="btn s r" data-k="${k}" data-d="x">${t('rm')}</button></div>`).join('')+`<div class="total"><span>${t('total')}</span><span>${money(tot)}</span></div>`:`<div class="empty"><p class="mut" style="margin-bottom:16px">${t('cartEmpty')}</p><a class="btn" href="menu.html">${t('backmenu')}</a></div>`;
  const o=$('ty');o.options[0].text=t('pickup');o.options[1].text=t('delivery');
  $('cl').hidden=shop.open;$('cl').textContent=t('closedmsg');$('go').disabled=!c.length||!shop.open;
}
$('lines').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const c=getCart(),k=+b.dataset.k;
  if(b.dataset.d==='x')c.splice(k,1);else{c[k].q+=+b.dataset.d;if(c[k].q<1)c.splice(k,1)}setCart(c);draw()};
$('f').onsubmit=e=>{e.preventDefault();const c=getCart();if(!c.length||!shop.open)return;
  const n=$('n').value.trim(),p=$('p').value.trim();if(!n||!p)return toast(t('fill'));
  const tot=c.reduce((a,i)=>a+i.p*i.q,0),ad=$('ad').value.trim();
  const m=`*THARU Juice Bar*\n${t('wOrder')}\n\n`+c.map((i,k)=>`${k+1}. ${nm(i)} x ${i.q} = ${money(i.p*i.q)}`).join('\n')+`\n\n*${t('total')}: ${money(tot)}*\n\n${t('name')}: ${n}\n${t('phone')}: ${p}\n${t('type')}: ${t($('ty').value)}`+(ad?`\n${t('addr')}: ${ad}`:'');
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank','noopener');setCart([]);draw()};
document.addEventListener('langchange',draw);document.addEventListener('shopchange',draw);
</script></body></html>
