<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="images/logo001.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THARU Juice Bar | Cart & Checkout</title>
<style>
:root{--green:#174c37;--lime:#d9f36a;--cream:#fff9eb;--orange:#ff8a35;--ink:#19372b;--muted:#65766b;--page-bg:#fff9eb;--surface:#ffffff;--body-text:#19372b;--muted-text:#65766b;--border-color:#e9eddf;--header-bg:rgba(255,249,235,.93)}
body.dark-mode{--page-bg:#101a15;--surface:#1b2921;--body-text:#edf5ee;--muted-text:#b1c1b5;--border-color:#34483b;--header-bg:rgba(16,26,21,.94);color-scheme:dark}
body:not(.dark-mode){color-scheme:light}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:var(--page-bg);color:var(--body-text)}a{color:inherit;text-decoration:none}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-color)}.nav{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:76px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.18rem}.logo-image{width:46px;height:46px;object-fit:contain;border-radius:10px}.navlinks{display:flex;align-items:center;gap:12px;color:var(--muted-text);font-size:.94rem;font-weight:650}
.theme-toggle,.cart-toggle{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-color);border-radius:999px;padding:10px 13px;background:var(--surface);color:var(--body-text);font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}
.cart-badge{background:var(--orange);color:white;border-radius:999px;padding:2px 8px;font-size:.78rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 20px;font-weight:800;background:var(--green);color:white;cursor:pointer}.btn.light{background:var(--lime);color:var(--green)}

.cart-page{padding:50px 0;min-height:75vh}
.cart-page-container{background:var(--surface);border-radius:28px;width:min(700px,100%);margin:0 auto;padding:32px;border:1px solid var(--border-color);box-shadow:0 15px 40px rgba(0,0,0,0.08)}
.cart-page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;border-bottom:1px solid var(--border-color);padding-bottom:15px}
.cart-page-header h2{margin:0;color:var(--green);font-size:1.8rem}
.cart-items-list{max-height:250px;overflow-y:auto;margin-bottom:20px;border-bottom:1px solid var(--border-color);padding-bottom:15px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color)}
.cart-item:last-child{border-bottom:0}
.cart-item-info strong{display:block;color:var(--green);font-size:1rem}
.cart-item-info span{font-size:0.88rem;color:var(--muted-text)}

.checkout-form{display:flex;flex-direction:column;gap:15px;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:0.88rem;font-weight:700;color:var(--green)}
.form-control{width:100%;padding:12px 15px;border:1px solid var(--border-color);border-radius:12px;background:var(--page-bg);color:var(--body-text);font:inherit;font-size:0.95rem}
.form-control:focus{outline:none;border-color:var(--green)}

.cart-page-footer{border-top:1px solid var(--border-color);padding-top:18px;display:flex;flex-direction:column;gap:15px}
.cart-total-row{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:900;color:var(--green)}

footer{padding:28px 0;background:#103b2a;color:#d8e7dd;font-size:.9rem;margin-top:50px}.footer-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}

body.dark-mode .cart-page-container{background:#1b2921;border-color:#34483b}
body.dark-mode .cart-page-header h2,body.dark-mode .cart-total-row,body.dark-mode .form-group label{color:var(--lime)}
body.dark-mode .form-control{background:#24362a;color:var(--body-text);border-color:#34483b}
@media(max-width:800px){.navlinks a:not(.cart-toggle){display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <img class="logo-image" src="images/logo001.png" alt="Logo">
      <span>THARU <span style="color:#ff8a35">JUICE BAR</span></span>
    </a>
    <nav class="navlinks">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu & Order</a>
      <a href="index.html#about">Our Story</a>
      <a href="index.html#contact">Contact</a>
      <button class="theme-toggle" id="themeToggle" type="button">🌙</button>
      <a class="cart-toggle" href="cart.html" style="color:var(--green); font-weight:bold;">🛒 Cart <span class="cart-badge" id="cartBadge">0</span></a>
    </nav>
  </div>
</header>

<main class="cart-page">
  <div class="wrap">
    <div class="cart-page-container">
      <div class="cart-page-header">
        <h2>Your Cart & Checkout 🛒</h2>
        <a class="btn light" href="menu.html" style="padding: 8px 16px; font-size: 0.85rem;">← Back to Menu</a>
      </div>

      <div class="cart-items-list" id="cartItemsContainer">
        <p style="text-align:center; color:var(--muted-text);">Your cart is empty!</p>
      </div>
      
      <!-- Customer Details Form -->
      <div class="checkout-form">
        <div class="form-group">
          <label for="custName">නම (Name)</label>
          <input type="text" id="custName" class="form-control" placeholder="ඔබේ නම ඇතුළත් කරන්න">
        </div>
        <div class="form-group">
          <label for="custAddress">ලිපිනය (Address)</label>
          <textarea id="custAddress" class="form-control" rows="2" placeholder="බෙදාහැරීමේ ලිපිනය ඇතුළත් කරන්න"></textarea>
        </div>
        <div class="form-group">
          <label for="custPhone">දුරකථන අංකය (Phone Number)</label>
          <input type="tel" id="custPhone" class="form-control" placeholder="උදා: 0712345678">
        </div>
      </div>

      <div class="cart-page-footer">
        <div class="cart-total-row">
          <span>Total Amount:</span>
          <span id="cartTotalAmount">LKR 0</span>
        </div>
        <button class="btn" id="whatsappCheckoutBtn" style="width:100%;">Order via WhatsApp</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap footer-row">
    <div><strong>🍊 THARU Juice Bar</strong><br>Fresh, fruity & feel-good.</div>
    <div>© <span id="year"></span> THARU Juice Bar</div>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
const WHATSAPP_NUMBER = '94789280918';

const themeToggle = document.getElementById('themeToggle');
function applyTheme(isDark){
  document.body.classList.toggle('dark-mode', isDark);
  themeToggle.textContent = isDark ? '☀️' : '🌙';
}
let savedTheme = localStorage.getItem('tharu-theme') || 'light';
applyTheme(savedTheme === 'dark');
themeToggle.addEventListener('click', () => {
  const isDark = !document.body.classList.contains('dark-mode');
  applyTheme(isDark);
  localStorage.setItem('tharu-theme', isDark ? 'dark' : 'light');
});

// Load and Render Cart Data
function renderCart(){
  let cart = JSON.parse(localStorage.getItem('tharu_cart')) || [];
  const cartBadge = document.getElementById('cartBadge');
  const container = document.getElementById('cartItemsContainer');
  const totalElem = document.getElementById('cartTotalAmount');

  let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
  cartBadge.textContent = totalItems;

  if(cart.length === 0){
    container.innerHTML = '<p style="text-align:center; color:var(--muted-text); margin-top:10px;">Your cart is empty!</p>';
    totalElem.textContent = 'LKR 0';
    return;
  }

  let html = '';
  let totalPrice = 0;
  cart.forEach((item, index) => {
    let itemTotal = item.price * item.qty;
    totalPrice += itemTotal;
    html += `
      <div class="cart-item">
        <div class="cart-item-info">
          <strong>${item.name}</strong>
          <span>LKR ${item.price} x ${item.qty}</span>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <strong>LKR ${itemTotal}</strong>
          <button onclick="removeItem(${index})" style="border:0; background:none; color:red; cursor:pointer; font-size:1.1rem; font-weight:bold;">✕</button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  totalElem.textContent = `LKR ${totalPrice}`;
}

function removeItem(index){
  let cart = JSON.parse(localStorage.getItem('tharu_cart')) || [];
  cart.splice(index, 1);
  localStorage.setItem('tharu_cart', JSON.stringify(cart));
  renderCart();
}

renderCart();

// WhatsApp Checkout
document.getElementById('whatsappCheckoutBtn').addEventListener('click', () => {
  let cart = JSON.parse(localStorage.getItem('tharu_cart')) || [];
  if(cart.length === 0){
    alert('Please add items to your cart first!');
    return;
  }

  const name = document.getElementById('custName').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const phone = document.getElementById('custPhone').value.trim();

  if(!name || !address || !phone){
    alert('කරුණාකර ඔබේ නම, ලිපිනය සහ දුරකථන අංකය ඇතුළත් කරන්න!');
    return;
  }

  let text = 'Hi THARU Juice Bar! I would like to place an order:\n\n';
  let totalPrice = 0;
  cart.forEach(item => {
    let itemTotal = item.price * item.qty;
    totalPrice += itemTotal;
    text += `• ${item.name} (Qty: ${item.qty}) - LKR ${itemTotal}\n`;
  });

  text += `\n*Total Amount: LKR ${totalPrice}*\n\n`;
  text += `*Customer Details:*\n`;
  text += `• Name: ${name}\n`;
  text += `• Address: ${address}\n`;
  text += `• Phone: ${phone}`;

  const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  window.open(waUrl, '_blank');
});
</script>
</body>
</html>
