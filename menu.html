<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="images/logo001.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script>document.documentElement.dataset.theme=localStorage.tharu_theme||"light"</script><title>Menu | THARU Juice Bar</title></head>
<body><div id="hdr"></div>
<main class="wrap"><section><h2 data-i18n="menuT"></h2><div id="chips" class="chips" role="tablist"></div><div id="list" class="grid"></div></section></main><div id="ftr"></div>
<script type="module">
import {db,configured,FS,mountHeader,t,nm,money,lang,getCart,setCart,toast} from './js/app.js';
mountHeader('menu.html');
const cats=['all','juice','smoothie','shake','other'];
const demo=[{id:'d1',nameEn:'Orange Juice',nameSi:'දොඩම් යුෂ',price:350,category:'juice',inStock:true},{id:'d2',nameEn:'Mango Smoothie',nameSi:'අඹ ස්මූති',price:450,category:'smoothie',inStock:true},{id:'d3',nameEn:'Banana Shake',nameSi:'කෙසෙල් ෂේක්',price:400,category:'shake',inStock:false}];
let items=[],cat='all';
const $=id=>document.getElementById(id);
function draw(){
  $('chips').innerHTML=cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}" role="tab">${t(c)}</button>`).join('');
  const v=items.filter(i=>cat==='all'||i.category===cat);
  $('list').innerHTML=v.length?v.map(i=>`<article class="clay item ${i.inStock===false?'out':''}"><img src="${i.img||'images/logo.svg'}" alt="${nm(i).replace(/"/g,'')}" loading="lazy" onerror="this.onerror=null;this.src='images/logo.svg'">${i.inStock===false?`<span class="badge">${t('oos')}</span>`:''}<div class="b"><h3>${nm(i).replace(/</g,'&lt;')}</h3><span class="price">${money(i.price)}</span><button class="btn" data-id="${i.id}" ${i.inStock===false?'disabled':''}>${t('add')}</button></div></article>`).join(''):`<p class="empty mut">${t('none')}</p>`;
}
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;draw()}};
$('list').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const i=items.find(x=>x.id===b.dataset.id),c=getCart(),l=c.find(x=>x.id===i.id);
  l?l.q++:c.push({id:i.id,nameEn:i.nameEn||'',nameSi:i.nameSi||'',p:Number(i.price),q:1});setCart(c);toast(t('added'))};
document.addEventListener('langchange',draw);
if(configured)FS.onSnapshot(FS.collection(db,'menu'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nameEn||'').localeCompare(b.nameEn||''));draw()},()=>{$('list').innerHTML='<p class="empty">Could not load the menu.</p>'});
else{items=demo;draw()}
</script></body></html>
