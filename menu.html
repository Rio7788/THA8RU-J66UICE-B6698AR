<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THARU Juice Bar</title><link rel="icon" type="image/png" href="images/logo001.png"><link rel="stylesheet" href="css/style.css"></head><body><header id="hd"></header><div id="bar" hidden></div><main>
<section><h2 data-i="menu_h"></h2><div id="chips" class="chips"></div><div id="grid" class="grid g3"></div></section>
</main><footer id="ft"></footer><script type="module">
import{db}from"./js/firebase-config.js";
import{collection,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import{$,t,pick,fmt,cart,save}from"./js/app.js";
const C=["all","juice","smoothie","shake"],ic={juice:"orange",smoothie:"berry",shake:"glass"};
let items=[{id:"d1",nameEn:"Orange juice",nameSi:"දොඩම් යුෂ",price:450,cat:"juice",inStock:true},{id:"d2",nameEn:"Mixed berry smoothie",nameSi:"බෙරි ස්මූතී",price:650,cat:"smoothie",inStock:true},{id:"d3",nameEn:"Chocolate milkshake",nameSi:"චොකලට් මිල්ක්ෂේක්",price:600,cat:"shake",inStock:false}],cat="all";
onSnapshot(collection(db,"menu"),s=>{if(!s.empty){items=s.docs.map(d=>({id:d.id,...d.data()}));draw()}},()=>{});
function draw(){
$("#chips").innerHTML=C.map(c=>`<button class="clay pill${c==cat?" on":""}" data-c="${c}">${t("c_"+c)}</button>`).join("");
$("#grid").innerHTML=items.filter(i=>cat=="all"||i.cat==cat).map(i=>`<article class="clay item${i.inStock?"":" oos"}">${i.img?`<img src="${i.img}" alt="${pick(i,"name")}" loading="lazy">`:`<svg class="ic"><use href="#${ic[i.cat]||"orange"}"/></svg>`}<h3>${pick(i,"name")}</h3><p class="pr">${fmt(i.price)}</p>${i.inStock?`<button class="btn" data-a="${i.id}">${t("add")}</button>`:`<span class="badge no">${t("out")}</span>`}</article>`).join("")}
document.onclick=e=>{const c=e.target.closest("[data-c]"),a=e.target.closest("[data-a]");if(c){cat=c.dataset.c;draw()}
if(a){const i=items.find(x=>x.id==a.dataset.a),k=cart(),r=k.find(x=>x.id==i.id);r?r.qty++:k.push({id:i.id,nameEn:i.nameEn,nameSi:i.nameSi,price:i.price,qty:1});save(k);a.textContent=t("added");setTimeout(draw,900)}};
document.addEventListener("lang",draw);draw();
</script></body></html>
